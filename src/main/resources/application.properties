spring.application.name=auth
server.port=${PORT:8080}

# ===== Datasource (Aiven MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT (required — JwtUtil's @Value fields have no defaults) =====
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ===== Mail (Resend HTTPS API) — Render's free tier blocks outbound SMTP ports, so transactional
# email goes out over HTTPS instead of SMTP.
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:no-reply@flowmatic.com}

# ===== Spring AI (via Groq — OpenAI-compatible API) =====
# Groq speaks the OpenAI API, so we keep the OpenAI client and just point it at Groq's base URL.
# Spring AI appends "/chat/completions", so the base must end in /openai/v1 to reach
# Groq's endpoint: https://api.groq.com/openai/v1/chat/completions
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL:llama-3.3-70b-versatile}

# ===== Workflow file uploads (Cloudinary — raw resources, authenticated/signed delivery) =====
cloudinary.url=${CLOUDINARY_URL}

# ===== Workflow run queue =====
# How often the scheduler drains queued runs (executed strictly one-at-a-time, FIFO).
app.workflow.poll-interval-ms=1000

# ===== Workflow run quota =====
# Lifetime cap on workflow runs per user before they must subscribe. ADMIN users are exempt.
app.workflow.lifetime-run-limit=10

# Lifetime run caps for the two non-unlimited paid tiers. ENTERPRISE has no entry here — it's a
# real exemption (see WorkflowRunQuotaService.isExempt), not a large number standing in for
# "unlimited".
app.workflow.plan-limits.essentials=${PLAN_LIMIT_ESSENTIALS:100}
app.workflow.plan-limits.pro=${PLAN_LIMIT_PRO:1000}

# ===== Google Drive integration (OAuth2) =====
# Custom flow persists tokens in user_integrations (see UserIntegrationService). Credentials from env.
app.integrations.google.client-id=${GOOGLE_CLIENT_ID:}
app.integrations.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.integrations.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
app.integrations.google.scope=https://www.googleapis.com/auth/drive.readonly
# NOTE: spring-boot-starter-oauth2-client is on the classpath. A standard
# spring.security.oauth2.client.registration.google.* block can be added once real credentials
# exist; it is intentionally omitted here because an empty client-id breaks context startup.

# ===== OTP email verification policy =====
app.otp.length=6
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ===== Google OAuth2 placeholder (do NOT enable yet) =====
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=email,profile
# spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
# spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token

# ===== Stripe (subscription billing) =====
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.price-id.essentials=${STRIPE_PRICE_ESSENTIALS:}
app.stripe.price-id.pro=${STRIPE_PRICE_PRO:}
app.stripe.price-id.enterprise=${STRIPE_PRICE_ENTERPRISE:}
app.frontend.success-url=${FRONTEND_URL:http://localhost:5173}/billing/success
app.frontend.cancel-url=${FRONTEND_URL:http://localhost:5173}/billing/cancel
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
