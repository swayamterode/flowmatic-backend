spring.application.name=auth
server.port=8080

# ============================================================================
# TEMPLATE — copy this file to application.properties and fill in real values.
#   cp src/main/resources/application-example.properties \
#      src/main/resources/application.properties
# application.properties is git-ignored so real secrets are never committed.
# Values written as ${ENV_VAR} are read from the environment (or a .env on your
# host); values written as CHANGE_ME must be replaced before the app will start.
# ============================================================================

# ===== Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT (required — JwtUtil's @Value fields have no defaults) =====
# Generate a strong Base64 secret, e.g.:
#   openssl rand -base64 64
app.jwt.secret=CHANGE_ME
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ===== Mail (SMTP) — supply credentials via env vars so it deploys cleanly =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
# For Gmail, use an App Password (not your account password).
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@flowmatic.com

# ===== OTP email verification policy =====
app.otp.length=6
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

