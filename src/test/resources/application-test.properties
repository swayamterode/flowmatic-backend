# In-memory H2 for integration tests. Overrides the MySQL datasource from application.properties;
# JWT / mail / OpenAI / Cloudinary placeholders are inherited from the base file (real beans are
# mocked in tests).
spring.datasource.url=jdbc:h2:mem:flowmatic_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Allow the test ChatClient bean to override the auto-wired one.
spring.main.allow-bean-definition-overriding=true
